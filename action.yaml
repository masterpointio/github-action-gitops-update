name: gitops-update
description: Reusable GitHub Action to update a YAML file and commit the result
author: hello@masterpoint.io

inputs:
  new_value:
    description: New value that should replace the existing value at the given YAML path
    required: true
  yaml_key_paths:
    description: Comma-separated list of paths to the YAML keys that should be updated within the given YAML file
    required: true
  yaml_file_path:
    description: Path to the YAML file that should be updated
    required: true
  commit_message:
    description: Commit message that should be used when committing the changes
    required: true
  commit_username:
    description: The username of the user that will execute the commit.
    default: github-actions
    required: false
  commit_email:
    description: The email of the user that will execute the commit.
    default: github-actions@github.com
    required: false
  target_branch:
    description: The branch that should be pushed to
    default: ${{ github.event.repository.default_branch }}
    required: false
  github_token:
    description: The GitHub token used to commit and push the gitops changes (unnecessary if you don't have branch protections enabled on your target branch)
    default: ${{ github.token }}
    required: false
  max_attempts:
    description: Number of times to retry the push when the target branch moved
    default: "5"
    required: false

outputs:
  sha:
    description: SHA of the pushed commit
    value: ${{ steps.commit.outputs.sha }}
  base_sha:
    description: SHA of the pushed commit's parent (target_branch before this update)
    value: ${{ steps.commit.outputs.base_sha }}

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        token: ${{ inputs.github_token }}

    - name: 🏗 Set up yq
      uses: frenck/action-setup-yq@c4b5be8b4a215c536a41d436757d9feb92836d4f # v1.0.2

    - name: Update, Commit and Push
      id: commit
      shell: bash
      env:
        NEW_VALUE: ${{ inputs.new_value }}
        YAML_KEY_PATHS: ${{ inputs.yaml_key_paths }}
        YAML_FILE_PATH: ${{ inputs.yaml_file_path }}
        COMMIT_MESSAGE: ${{ inputs.commit_message }}
        COMMIT_USERNAME: ${{ inputs.commit_username }}
        COMMIT_EMAIL: ${{ inputs.commit_email }}
        TARGET_BRANCH: ${{ inputs.target_branch }}
        MAX_ATTEMPTS: ${{ inputs.max_attempts }}
      run: |
        git config user.name "$COMMIT_USERNAME"
        git config user.email "$COMMIT_EMAIL"
        IFS=',' read -r -a key_paths <<< "$YAML_KEY_PATHS"

        # Re-apply the edit on a fresh target branch each attempt, so a concurrent push never needs a merge.
        for ((attempt = 1; attempt <= MAX_ATTEMPTS; attempt++)); do
          git fetch --depth=1 origin "$TARGET_BRANCH"
          git reset --hard FETCH_HEAD
          for key_path in "${key_paths[@]}"; do
            # diff/patch keeps the blank lines that yq strips: https://github.com/mikefarah/yq/issues/515
            yq "(${key_path}) = strenv(NEW_VALUE)" "$YAML_FILE_PATH" | diff -B "$YAML_FILE_PATH" - | patch --silent "$YAML_FILE_PATH" - && echo "Updated $key_path"
          done
          git add "$YAML_FILE_PATH"
          git commit --allow-empty -m "ci(gitops): ${COMMIT_MESSAGE}"
          if git push origin "HEAD:${TARGET_BRANCH}"; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "base_sha=$(git rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Push rejected (attempt ${attempt}/${MAX_ATTEMPTS}); retrying on the latest ${TARGET_BRANCH}"
          sleep $((RANDOM % 10 + 5))
        done
        echo "::error::Push to ${TARGET_BRANCH} rejected ${MAX_ATTEMPTS} times"
        exit 1
